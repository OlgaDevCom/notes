# Generated by AppGen. The project lints with flutter_lints plus the rules a
# generated project is expected to keep passing.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"
    # `flutter pub get` appends these to any analysis_options.yaml that lacks
    # them; carrying them means a checkout stays clean after resolving.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - unawaited_futures
