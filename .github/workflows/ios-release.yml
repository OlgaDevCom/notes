# Generated by AppGen v1. Declares exactly the inputs the
# ASO platform dispatches; do not rename them.
name: iOS release
run-name: iOS ${{ inputs.version_string }} (${{ inputs.build_number }}) [${{ inputs.aso_dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: MARKETING_VERSION
        required: true
        type: string
      build_number:
        description: CURRENT_PROJECT_VERSION
        required: true
        type: string
      aso_dispatch_id:
        description: Correlation id set by the ASO platform
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26   # App Store Connect requires the iOS 26 SDK
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: setup_flutter
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap project

        run: bash scripts/appgen-ci.sh bootstrap
      # The certificate and profile come from this repository's own secrets
      # (Settings → Secrets and variables → Actions); scripts/archive.sh imports them.
      - name: Archive and export
        env:
          VERSION: ${{ inputs.version_string }}
          BUILD: ${{ inputs.build_number }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/archive.sh "$VERSION" "$BUILD"   # writes build/App.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
