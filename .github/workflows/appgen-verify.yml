# Generated by AppGen v1. What has to keep passing for this
# repository to be worth building: it resolves, it analyzes, its tests pass,
# and each selected native platform compiles.
name: AppGen verify
run-name: Verify ${{ inputs.aso_dispatch_id || github.sha }}

on:
  push:
  workflow_dispatch:
    inputs:
      aso_dispatch_id:
        description: Correlation id set by the ASO platform
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: appgen-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: subosito/flutter-action@v2
        id: setup_flutter
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Validate shell syntax
        id: shell_syntax
        run: bash -n scripts/bootstrap.sh scripts/appgen-ci.sh
      - name: Bootstrap project
        id: bootstrap
        run: bash scripts/appgen-ci.sh bootstrap
      - name: Check formatting
        id: format
        run: bash scripts/appgen-ci.sh format
      - name: Analyze
        id: analyze
        run: bash scripts/appgen-ci.sh analyze
      - name: Test
        id: test
        run: bash scripts/appgen-ci.sh test
  build_android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: setup_flutter
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap project
        run: bash scripts/appgen-ci.sh bootstrap
      - name: Build Android debug app
        id: build_android_debug
        run: bash scripts/appgen-ci.sh build_android_debug
      - name: Create ephemeral release signing key and properties
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore android/app/verify-upload.jks -storetype JKS -storepass appgen-verify-store -keypass appgen-verify-key -alias appgen-verify -dname "CN=AppGen Release Verification" -keyalg RSA -keysize 2048 -validity 2
          printf 'storeFile=verify-upload.jks\nstorePasswordBase64=%s\nkeyAliasBase64=%s\nkeyPasswordBase64=%s\n' \
            "$(printf '%s' 'appgen-verify-store' | base64 -w 0)" \
            "$(printf '%s' 'appgen-verify' | base64 -w 0)" \
            "$(printf '%s' 'appgen-verify-key' | base64 -w 0)" \
            > android/key.properties
      - name: Build and verify signed Android release bundle
        id: build_android_release
        run: bash scripts/appgen-ci.sh build_android_release
      - name: Enable KVM for screenshot capture
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android screenshot
        id: screen_gen_android
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOCALES: en
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/screen-gen-capture.sh android-phone emulator-5554
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v6
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: appgen-verify-screenshots-android
          path: |
            screen-gen/
            screen-gen-logs/
          if-no-files-found: ignore
          retention-days: 3
  build_ios:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: setup_flutter
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap project
        run: bash scripts/appgen-ci.sh bootstrap
      - name: Build iOS simulator app
        id: build_ios_simulator
        run: bash scripts/appgen-ci.sh build_ios_simulator
      - name: Boot simulator for screenshot capture
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pattern='^iPhone [0-9]+ Pro Max$'
          udid=$(xcrun simctl list devices available -j | jq -r --arg p "$pattern" '[.devices[][] | select(.name | test($p))] | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone Pro Max simulator is available."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Capture iOS screenshot
        id: screen_gen_ios
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          LOCALES: en
          DEVICE: iphone-6.9
        run: bash scripts/screen-gen-capture.sh "$DEVICE" "$SIM_UDID"
      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v6
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: appgen-verify-screenshots-ios
          path: |
            screen-gen/
            screen-gen-logs/
          if-no-files-found: ignore
          retention-days: 3
