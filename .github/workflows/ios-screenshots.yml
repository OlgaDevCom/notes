# Generated by AppGen v1. Declares exactly the inputs Screen Gen
# dispatches; do not rename them.
name: iOS screenshots
run-name: iOS screenshots [${{ inputs.aso_dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Store locale codes, comma-separated
        required: true
        type: string
      devices:
        description: Screen Gen device ids, comma-separated
        required: true
        type: string
      aso_dispatch_id:
        description: Correlation id set by the ASO platform
        required: true
        type: string

permissions:
  contents: read
  actions: read   # the collect job asks which capture artifacts exist

concurrency:
  group: screen-gen-ios
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.split.outputs.devices }}
    steps:
      - id: split
        env:
          DEVICES: ${{ inputs.devices }}
        run: echo "devices=$(jq -cn --arg v "$DEVICES" '$v | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap project
        run: bash scripts/bootstrap.sh
      - name: Boot simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          case "$DEVICE" in
            iphone-6.9) pattern='^iPhone [0-9]+ Pro Max$' ;;
            ipad-13)    pattern='^iPad Pro 13-inch' ;;
            *) echo "::error::Unknown iOS device '$DEVICE'."; exit 1 ;;
          esac
          udid=$(xcrun simctl list devices available -j | jq -r --arg p "$pattern" '[.devices[][] | select(.name | test($p))] | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No simulator matches '$pattern'. Available:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Capture
        env:
          LOCALES: ${{ inputs.locales }}
          DEVICE: ${{ matrix.device }}
        run: bash scripts/screen-gen-capture.sh "$DEVICE" "$SIM_UDID"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: screen-gen-${{ matrix.device }}
          path: screen-gen/
          # The capture step already failed with the locales and the reason; a
          # second error here would only bury it.
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0   # PNGs are already compressed
      - name: Keep the capture logs
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: capture-logs-${{ matrix.device }}
          path: screen-gen-logs/
          if-no-files-found: ignore
          retention-days: 3

  collect:
    needs: capture
    # Runs when some devices failed too: partial screenshots are still collected.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Merging nothing fails with "No artifacts found", which hides the reason
      # the capture jobs already printed. Say it instead.
      - id: uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Preserve API failures through the JSON-processing pipeline.
          set -o pipefail
          count=$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -er '[.[].artifacts[] | select(.name | startswith("screen-gen-"))] | length') || count=unknown
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.uploaded.outputs.count == '0' }}
        run: |
          echo "::error::No device uploaded screenshots, so there is nothing to collect. Each capture job above ends with the locales that failed, and its capture-logs artifact has the full output."
          exit 1
      - if: ${{ steps.uploaded.outputs.count == 'unknown' }}
        run: |
          echo "::error::Could not inspect this run's artifacts. See the API or JSON error above; check actions: read permissions if GitHub returned HTTP 403."
          exit 1
      - uses: actions/upload-artifact/merge@v6
        with:
          name: store-captures
          pattern: screen-gen-*
          # Source artifacts expire after one day; keeping deletion disabled
          # avoids requiring actions: write on the workflow token.
          delete-merged: false
          retention-days: 3
          compression-level: 0
