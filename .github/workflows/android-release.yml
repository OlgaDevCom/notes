# Generated by AppGen v1. Declares exactly the inputs the
# ASO platform dispatches; do not rename them.
name: Android release
run-name: Android ${{ inputs.version_string }} (${{ inputs.build_number }}) [${{ inputs.aso_dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: versionName
        required: true
        type: string
      build_number:
        description: versionCode, an integer higher than any uploaded to Google Play
        required: true
        type: string
      aso_dispatch_id:
        description: Correlation id set by the ASO platform
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Validate build inputs
        env:
          VERSION_CODE: ${{ inputs.build_number }}
        run: |
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo "build_number must be an integer from 1 to 2100000000" >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        id: setup_flutter
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Bootstrap project

        run: bash scripts/appgen-ci.sh bootstrap
      # The upload keystore comes from this repository's own secrets
      # (Settings → Secrets and variables → Actions).
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required release signing secret ${secret_name} is not configured. Add all four Android signing secrets in repository Actions secrets."
              exit 1
            fi
            if [[ "${!secret_name}" == *$'\n'* || "${!secret_name}" == *$'\r'* ]]; then
              echo "::error::Release signing secret ${secret_name} must be a single line."
              exit 1
            fi
          done
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks || [[ ! -s android/app/upload-keystore.jks ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 or contains an empty keystore."
            exit 1
          fi
          # Keep arbitrary secret characters out of Java Properties syntax.
          # Gradle decodes these values after Properties has parsed the file.
          printf 'storeFile=%s\nstorePasswordBase64=%s\nkeyAliasBase64=%s\nkeyPasswordBase64=%s\n' \
            'upload-keystore.jks' \
            "$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | base64 -w 0)" \
            "$(printf '%s' "$ANDROID_KEY_ALIAS" | base64 -w 0)" \
            "$(printf '%s' "$ANDROID_KEY_PASSWORD" | base64 -w 0)" \
            > android/key.properties
      - name: Build App Bundle
        env:
          # Inputs go through env, never interpolated into the script body.
          VERSION_NAME: ${{ inputs.version_string }}
          VERSION_CODE: ${{ inputs.build_number }}
        run: flutter build appbundle --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"
      - uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3
          compression-level: 0   # an AAB is already compressed
